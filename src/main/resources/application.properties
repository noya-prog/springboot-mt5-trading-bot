spring.application.name=springbot

# Server
server.port=8080

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:tradingbot
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop

# Logging
logging.level.com.tradingbot=DEBUG

# Risk management settings
bot.risk.enabled=true
bot.risk.max-daily-loss-usd=50.0
bot.risk.min-lot-size=0.01
bot.risk.max-lot-size=0.10
bot.risk.default-lot-size=0.01
bot.risk.stop-loss-pips=20
bot.risk.take-profit-pips=40
bot.risk.pip-value=0.00010